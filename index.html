<style id="mobile-responsive-fix-v2">
/* ===== Mobile responsive v2 =====
   Mobile uses normal document scrolling instead of locking the whole app to the viewport.
   This prevents iPhone landscape from becoming unscrollable and keeps product text visible.
*/
html, body {
  width: 100%;
  max-width: 100%;
  min-height: 100%;
  height: auto !important;
  overflow-x: hidden !important;
  overflow-y: auto !important;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: auto;
}

body {
  padding: 0;
}

.app {
  height: auto !important;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

@media (max-width: 800px) {
  .app {
    min-height: 100dvh;

<body>
<div id="app" class="app hidden"></div>
<div id="login" class="login">
  <div class="loginbox">
    <div class="loginlogo">☕</div><h2 style="text-align:center;margin:5px 0">POS Kasir</h2>
    <div class="field"><label>Nama Kasir</label><input id="loginName" class="input" placeholder="Nama kasir"></div>
    <div class="field"><label>Shift</label><select id="loginShift" class="select"><option value="1">Shift 1</option><option value="2">Shift 2</option><option value="3">Shift 3</option></select></div>
    <button class="btn primary" style="width:100%;margin-top:6px" onclick="login()">Masuk</button>
    <button class="btn light" style="width:100%;margin-top:8px" onclick="openReport(true)">Lihat Laporan</button>
  </div>
</div>
<div id="modal" class="modal hidden"></div>
<div id="toast" class="toast hidden"></div>
<script>
const KEY='warkopKasirV1';
const PRINTER_SERVICES = [
  '00001101-0000-1000-8000-00805f9b34fb', // SPP Standard Serial Port Profile
  '49535343-fe7d-4ae5-8fa9-9fafd205e455', // ISSC Thermal Printer
  'e7810a71-73ae-499d-8c15-faa9aef0c3f2',
  '000018f0-0000-1000-8000-00805f9b34fb'  // General Service
];

const defaults={settings:{name:'Warkop',address:'',tax:0,logo:'',qris:''},shiftSessions:[],products:[
{id:'p1',cat:'Kopi',name:'Kopi Hitam',price:10000,icon:'☕',img:''},{id:'p2',cat:'Kopi',name:'Kopi Susu',price:14000,icon:'🥤',img:''},
{id:'p3',cat:'Non Kopi',name:'Teh Manis',price:7000,icon:'🍵',img:''},{id:'p4',cat:'Non Kopi',name:'Coklat',price:12000,icon:'🍫',img:''},
{id:'p5',cat:'Makanan',name:'Nasi Goreng',price:18000,icon:'🍳',img:''},{id:'p6',cat:'Cemilan',name:'Kentang Goreng',price:12000,icon:'🍟',img:''},
{id:'p7',cat:'Additional',name:'Telur',price:5000,icon:'🥚',img:''}],sales:[],voids:[],pending:[],lastNo:0};

let db=load(), btState='disconnected', btDevice=null, printCharacteristic=null;
let state={cashier:'',shift:'',cart:[],category:'Semua',screen:'kasir',discountType:'Rp',discount:0,sessionId:null,reportGuest:false};
restoreRuntime();

function load(){
 try{
   const x=JSON.parse(localStorage.getItem(KEY));
   const d=x||structuredClone(defaults);
   d.shiftSessions=d.shiftSessions||[];
   return d;
 }catch(e){return structuredClone(defaults)}
}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function persistRuntime(){
 db.runtime={
   cashier:state.cashier,shift:state.shift,sessionId:state.sessionId,
   cart:state.cart,category:state.category,discountType:state.discountType,discount:state.discount
 };
 save();
}
function clearRuntime(){
 db.runtime={cashier:'',shift:'',sessionId:null,cart:[],category:'Semua',discountType:'Rp',discount:0};
 save();
}
function restoreRuntime(){
 const r=db.runtime;
 if(!r||!r.cashier||!r.sessionId)return;
 const s=getSession(r.sessionId);
 if(!s||s.closed){clearRuntime();return;}
 state.cashier=r.cashier;state.shift=r.shift;state.sessionId=r.sessionId;
 state.cart=Array.isArray(r.cart)?r.cart:[];
 state.category=r.category||'Semua';state.discountType=r.discountType||'Rp';state.discount=r.discount||0;
 state.screen='kasir';state.reportGuest=false;
}
function rupiah(n){return 'Rp '+Math.round(n||0).toLocaleString('id-ID')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function now(){return new Date()}
function dateKey(d=new Date()){
 const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
 return `${y}-${m}-${day}`;
}
function shiftBusinessDate(s,d=new Date()){let x=new Date(d);if(String(s)==='3' && x.getHours()<7)x.setDate(x.getDate()-1);return dateKey(x)}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2600)}
function showPaymentNotice(title,message,type='success'){
 const old=document.getElementById('paymentNoticeBackdrop'); if(old)old.remove();
 const icon=type==='success'?'✓':'ⓘ';
 const wrap=document.createElement('div');
 wrap.id='paymentNoticeBackdrop';
 wrap.className='payment-notice-backdrop';
 wrap.innerHTML=`<div class="payment-notice" role="dialog" aria-modal="true"><div class="payment-notice-row"><div class="payment-icon ${type}">${icon}</div><div><div class="payment-title">${esc(title)}</div><div class="payment-message">${esc(message)}</div></div></div><div class="payment-notice-actions"><button class="btn primary" onclick="closePaymentNotice()">OK</button></div></div>`;
 document.body.appendChild(wrap);
}
function closePaymentNotice(){const el=document.getElementById('paymentNoticeBackdrop');if(el)el.remove()}
function iconFor(c){return {Kopi:'☕','Non Kopi':'🥤',Makanan:'🍛',Cemilan:'🍟',Additional:'➕'}[c]||'🍽️'}
function getSession(id){return (db.shiftSessions||[]).find(s=>s.id===id)}
function getActiveSession(shift,bizDate=shiftBusinessDate(shift)){
 return (db.shiftSessions||[]).find(s=>s.shift===String(shift)&&s.businessDate===bizDate&&!s.closed);
}
function createShiftSession(name,shift){
 const businessDate=shiftBusinessDate(shift);
 let existing=getActiveSession(shift,businessDate);
 if(existing){
   if(existing.cashier!==name){
     if(!confirm(`Shift ${shift} sedang aktif atas nama ${existing.cashier}. Apakah anda akan menggunakan shift ${shift} lagi?`)) return null;
   }
   return existing;
 }
 const prior=(db.shiftSessions||[]).find(s=>s.shift===String(shift)&&s.businessDate===businessDate&&s.closed);
 if(prior && !confirm(`Apakah anda akan menggunakan shift ${shift} lagi?`)) return null;
 const session={id:'S'+Date.now()+'_'+Math.random().toString(36).slice(2,7),date:new Date().toISOString(),businessDate,cashier:name,shift:String(shift),closed:false,closedAt:null};
 db.shiftSessions=db.shiftSessions||[];
 db.shiftSessions.push(session);
 save();
 return session;
}
function login(){
 const name=document.getElementById('loginName').value.trim(), shift=document.getElementById('loginShift').value;
 if(!name)return toast('Nama kasir wajib diisi.');
 const session=createShiftSession(name,shift);
 if(!session)return;
 state.cashier=name;state.shift=shift;state.sessionId=session.id;state.screen='kasir';state.reportGuest=false;
 persistRuntime();
 render();document.getElementById('login').classList.add('hidden');
}

function logout(){state.cashier='';state.shift='';state.sessionId=null;state.cart=[];state.reportGuest=false;state.screen='kasir';clearRuntime();document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden')}
function render(){
 const a=document.getElementById('app');a.classList.remove('hidden');
 const guest=!!state.reportGuest;
 const footer=guest
   ? `<button class="navbtn active" onclick="closeReport()">↩ Kembali ke Login</button>`
   : `<button class="navbtn ${state.screen==='laporan'?'active':''}" onclick="openReport()">📊 Laporan</button><button class="navbtn ${btState==='connected'?'bt-connected':''}" id="btNavBtn" onclick="bt()" title="${btState==='connected'?'Klik untuk memutuskan Bluetooth':btState==='pairing'?'Klik untuk memilih ulang printer Bluetooth':'Klik untuk menghubungkan Bluetooth'}">🖨️ <span id="btNavText">${btState==='pairing'?'⟳ Pairing…':btState==='connected'?'Putuskan BT':'Connect BT'}</span></button><button class="navbtn ${state.screen==='pengaturan'?'active':''}" onclick="openSettings()">⚙️ Pengaturan</button>`;
 a.innerHTML=`<header class="topbar"><div class="brand">${esc(db.settings.name)}</div><div class="status"><span class="pill" id="clock"></span><span class="pill">${esc(state.cashier||'Mode laporan')}</span>${state.shift?`<span class="pill">Shift ${state.shift}</span>`:''}</div></header>
 <main class="main">${state.screen==='kasir'?cashierHTML():state.screen==='laporan'?reportHTML():settingsHTML()}</main>
 <footer class="footer-nav">${footer}</footer>`;
 updateClock();
}
setInterval(updateClock,1000);
function updateClock(){const e=document.getElementById('clock');if(e)e.textContent=now().toLocaleString('id-ID',{dateStyle:'short',timeStyle:'medium'})}
function cashierHTML(){
 const cats=['Semua','Kopi','Non Kopi','Makanan','Cemilan','Additional','Lain-lain'];
 const q=window.menuQ||'';
 const ps=db.products.filter(p=>(state.category==='Semua'||p.cat===state.category)&&(`${p.name} ${p.cat}`).toLowerCase().includes(q.toLowerCase()));
 return `<section class="panel menu-panel"><div class="toolbar"><input class="input search" value="${esc(q)}" oninput="window.menuQ=this.value;filterMenuProducts()" placeholder="🔎 Cari menu..."></div><div class="cats">${cats.map(c=>`<button class="cat ${state.category===c?'active':''}" onclick="state.category='${c}';render()">${c}</button>`).join('')}</div><div class="products">${ps.length?ps.map(p=>`<button class="product" onclick="addCart('${p.id}')"><div class="pic">${p.img?`<img src="${p.img}">`:iconFor(p.cat)}</div><div class="pinfo"><div class="pname">${esc(p.name)}</div><div class="price">${rupiah(p.price)}</div></div></button>`).join(''):'<div class="empty" style="grid-column:1/-1">Menu tidak ditemukan.</div>'}</div></section>${cartHTML()}`;
}
function filterMenuProducts(){
  const q=(window.menuQ||'').toLowerCase();
  const box=document.querySelector('.menu-panel .products');
  if(!box)return;
  const ps=db.products.filter(p=>
    (state.category==='Semua'||p.cat===state.category) &&
    (`${p.name} ${p.cat}`).toLowerCase().includes(q)
  );
  box.innerHTML=ps.length
    ? ps.map(p=>`<button class="product" onclick="addCart('${p.id}')"><div class="pic">${p.img?`<img src="${p.img}">`:iconFor(p.cat)}</div><div class="pinfo"><div class="pname">${esc(p.name)}</div><div class="price">${rupiah(p.price)}</div></div></button>`).join('')
    : '<div class="empty" style="grid-column:1/-1">Menu tidak ditemukan.</div>';
}

function cartHTML(){
 const sub=state.cart.reduce((a,x)=>a+x.price*x.qty,0);
 const disc=state.discountType==='%'?sub*(Number(state.discount)||0)/100:Number(state.discount)||0;
 const after=Math.max(0,sub-disc),tax=Number(db.settings.tax)||0,ppn=tax?after*tax/100:0,total=after+ppn;
 const itemCount=state.cart.reduce((a,x)=>a+x.qty,0);
 return `<section class="panel cart">
   <div class="cart-tabs">
     <button class="pending-main" onclick="pending()"><span>Pending</span></button>
     <button class="pending-list-btn" onclick="pendingList()"><span>Daftar Pending</span></button>
   </div>
   <div class="cart-table">
     <div class="cartcols"><span>No</span><span>Nama Menu</span><span>Harga</span><span>Qty</span><span>Total</span><span>×</span></div>
     <div class="cartitems">${state.cart.length?state.cart.map((x,i)=>`
       <div class="cartrow">
         <span class="cart-no">${i+1}</span>
         <div class="cart-name"><span class="strong">${esc(x.name)}</span></div>
         <span class="cart-price">${rupiah(x.price)}</span>
         <div class="qty">
           <button onclick="changeQty('${x.id}',-1)">−</button><span>${x.qty}</span><button onclick="changeQty('${x.id}',1)">+</button>
         </div>
         <span class="cart-total">${rupiah(x.price*x.qty)}</span>
         <button class="remove-cart" title="Hapus" onclick="removeCart('${x.id}')">×</button>
       </div>`).join(''):`<div class="empty cart-empty">Belum ada menu dipilih.</div>`}</div>
   </div>
   <div class="summary">
     <div class="sumline"><span>Total Item</span><span>${itemCount}</span></div>
     <div class="sumline"><span>Subtotal</span><span>${rupiah(sub)}</span></div>

function generateReceiptText(s, isVoid=false, reprint=false) {
  const sub = s.items.reduce((a,x)=>a+x.price*x.qty, 0);
  const disc = s.discountType === '%' ? sub * s.discount / 100 : s.discount;
  const after = sub - disc;
  const ppn = s.tax ? after * s.tax / 100 : 0;

  let text = "";
  text += (db.settings.name || "WARKOP").toUpperCase() + "\n";
  if (db.settings.address) text += db.settings.address + "\n";
  if (isVoid) text += "*** VOID ***\n";
  if (reprint) text += "*** REPRINT ***\n";
  text += "--------------------------------\n";
  text += `No     : ${s.id}\n`;
  text += `Waktu  : ${new Date(s.date).toLocaleString('id-ID')}\n`;
  text += `Kasir  : ${s.cashier}\n`;
  text += `Meja   : ${s.customer}\n`;
  text += "--------------------------------\n";
  
  s.items.forEach(x => {
    text += `${x.name}\n`;
    const qtyPrice = `${x.qty} x ${rupiah(x.price)}`;
    const tot = rupiah(x.price * x.qty);
    const space = Math.max(1, 32 - qtyPrice.length - tot.length);
    text += qtyPrice + " ".repeat(space) + tot + "\n";
  });
  
  text += "--------------------------------\n";
  
  const padRow = (lbl, val) => {
    const sp = Math.max(1, 32 - lbl.length - val.length);
    return lbl + " ".repeat(sp) + val + "\n";
  };
  
  text += padRow("Subtotal", rupiah(sub));
  if (disc) text += padRow("Diskon", "-" + rupiah(disc));
  if (s.tax) text += padRow(`PPN ${s.tax}%`, rupiah(ppn));
  text += padRow("TOTAL", rupiah(s.total));
  
  if (s.method === 'Cash') {
    text += padRow("Diterima", rupiah(s.cash));
    text += padRow("Kembali", rupiah(s.change));
  }
  text += padRow("Metode", s.method);
  text += "--------------------------------\n";
  text += "       Terima Kasih! 🙏\n\n\n";

  return text;
}

function printViaRawBTText(plainText) {
  const ESC = '\x1B';
  const initPrinter = ESC + '@';
  const fullData = initPrinter + plainText;
  const base64Data = btoa(unescape(encodeURIComponent(fullData)));
  
  // Perbaiki bagian '-base64,' menjadi ':base64,'
  const intentUrl = 'intent:base64,' + base64Data + '#Intent;scheme=rawbt;package=ru.a404m.rawbtprinter;end;';
  
  try { 
    window.location.href = intentUrl; 
  } catch(e) { 
    toast('RawBT tidak dapat dibuka.'); 
  }
}

  actions.className = 'receipt-actions receipt-no-print';
  actions.innerHTML = `
    <button class="btn light" onclick="closeReceiptPreview()">Tutup</button>

  `;

function closeReceiptPreview(){const el=document.getElementById('receiptPreviewBackdrop');if(el)el.remove()}


async function printPreviewReceipt(){
  const preview = document.querySelector('#receiptPreviewBackdrop .receipt-print-paper');
  if (!preview) return;

  const plainText = preview.dataset.plainText || '';

  // 1. PRIORITAS UTAMA: Jika Bluetooth Direct sudah terhubung, cetak langsung via Bluetooth (Sama seperti Struk/Void/Reprint)
  if (btState === 'connected' && printCharacteristic) {
    try {
      await writeBluetoothReceipt(plainText);
      toast('Berhasil dicetak langsung via Bluetooth.');
      closeReceiptPreview();
      return;
    } catch (e) {
      console.error('Direct Web Bluetooth print failed:', e);
      resetBTState();
    }
  }

  // 2. Jika Laporan Owner DAN di Android (tapi Bluetooth BELUM terhubung), gunakan RawBT
  if (preview.dataset.ownerReport === '1' && navigator.userAgent.includes('Android')) {
    printViaRawBTText(plainText);
    closeReceiptPreview();
    return;
  }

  // 3. Jika Struk / Void / Reprint DAN di Android (tapi Bluetooth BELUM terhubung), gunakan RawBT
  if (navigator.userAgent.includes('Android')) {
    const sId = preview.dataset.saleId;
    const s = db.sales.find(x => x.id === sId);

    if (s) {
      const isVoid = preview.dataset.void === '1';
      const reprint = preview.dataset.reprint === '1';

      printViaRawBTText(generateReceiptText(s, isVoid, reprint));
      closeReceiptPreview();
      return;
    }
  }

  // 4. Fallback untuk browser desktop / iOS
  window.print();
}

async function writeBluetoothReceipt(plainText){
  if(btState!=='connected'||!printCharacteristic) return false;
  const ESC='\x1B';
  const data=new TextEncoder().encode(ESC+'@'+plainText);
  const chunkSize=printCharacteristic.properties?.writeWithoutResponse ? 180 : 180;
  for(let i=0;i<data.length;i+=chunkSize){
    const chunk=data.slice(i,i+chunkSize);
    if(printCharacteristic.properties?.writeWithoutResponse && printCharacteristic.writeValueWithoutResponse)
      await printCharacteristic.writeValueWithoutResponse(chunk);
    else
      await printCharacteristic.writeValue(chunk);
  }
  return true;
}

async function writeBluetoothReportOnly(plainText){
  if(btState!=='connected' || !printCharacteristic) return false;
  
  const ESC = '\x1B';
  const data = new TextEncoder().encode(ESC + '@' + plainText);
  
  // Ukuran potongan data yang pas untuk karakteristik BLE RPP02N
  const chunkSize = 180; 
  
  for(let i=0; i<data.length; i+=chunkSize){
    if(btState!=='connected' || !printCharacteristic) return false;
    
    const chunk = data.slice(i, i+chunkSize);
    
    if(printCharacteristic.properties?.writeWithoutResponse && printCharacteristic.writeValueWithoutResponse) {
      await printCharacteristic.writeValueWithoutResponse(chunk);
    } else {
      await printCharacteristic.writeValue(chunk);
    }
    
    // === KUNCI UTAMA: Memberikan jeda napas 15 milidetik ke printer RPP02N ===
    if (i + chunkSize < data.length) {
      await new Promise(resolve => setTimeout(resolve, 15));
    }
  }
  return true;
}

async function printReceipt(s,isVoid=false,reprint=false){
  const plainText=generateReceiptText(s,isVoid,reprint);
  // Direct print only when a real Web Bluetooth GATT connection is active.
  if(btState==='connected'&&printCharacteristic){
    try{
      await writeBluetoothReceipt(plainText);
      toast('Struk berhasil dicetak langsung via Bluetooth.');
      return;
    }catch(e){
      console.error('Direct Web Bluetooth print failed:',e);
      resetBTState();
    }
  }
  // No direct connection: show preview first.
  openReceiptPreview(s,isVoid,reprint);
}

// -------------------------------------------------------------
// WEB BLUETOOTH DIRECT (BLE/GATT ONLY)
// -------------------------------------------------------------
let btPairingToken=0;

async function bt(){
  if(btState==='connected'){
    try{if(btDevice?.gatt?.connected)btDevice.gatt.disconnect()}catch(e){}
    resetBTState();
    toast('Bluetooth berhasil diputuskan.');
    return;
  }

  // Pairing boleh dicoba kembali kapan saja. Ini penting jika pengguna
  // berpindah menu sehingga dialog Bluetooth sebelumnya dibatalkan browser.
  const pairingToken=++btPairingToken;
  setBTState('pairing');

  try{
    if(!navigator.bluetooth||!navigator.bluetooth.requestDevice){
      if(pairingToken===btPairingToken)resetBTState();
      toast('Browser ini tidak mendukung Web Bluetooth. Gunakan RawBT.');
      return;
    }

    // Important: classic SPP UUID 00001101 is NOT a Web Bluetooth GATT service.
    // We only ask for known BLE printer services here.
    const bleServices=[
      'e7810a71-73ae-499d-8c15-faa9aef0c3f2',
      '000018f0-0000-1000-8000-00805f9b34fb'
    ];

    const device=await navigator.bluetooth.requestDevice({
      acceptAllDevices:true,
      optionalServices:bleServices
    });

    // Jika pengguna sudah memulai pairing baru, abaikan hasil pairing lama.
    if(pairingToken!==btPairingToken){
      try{if(device?.gatt?.connected)device.gatt.disconnect()}catch(e){}
      return;
    }

    btDevice=device;
    const server=await device.gatt.connect();
    printCharacteristic=null;

    for(const uuid of bleServices){
      try{
        const service=await server.getPrimaryService(uuid);
        const chars=await service.getCharacteristics();
        printCharacteristic=chars.find(c=>c.properties.write||c.properties.writeWithoutResponse);
        if(printCharacteristic)break;
      }catch(e){}
    }

    if(!printCharacteristic)throw new Error('Printer tidak menyediakan BLE GATT write characteristic.');

    if(pairingToken!==btPairingToken){
      try{if(device?.gatt?.connected)device.gatt.disconnect()}catch(e){}
      return;
    }

    setBTState('connected');
    toast('Bluetooth Direct Connected: '+(device.name||'Printer BLE'));
    device.addEventListener?.('gattserverdisconnected',()=>{
      if(btDevice===device){
        resetBTState();
        toast('Bluetooth terputus.');
      }
    });
  }catch(e){
    console.error('Web Bluetooth:',e);
    // Jangan mengubah status dari percobaan lama jika sudah ada percobaan baru.
    if(pairingToken===btPairingToken)resetBTState();
    if(e?.name!=='NotFoundError'&&e?.name!=='AbortError'){
      toast('Printer tidak mendukung Web Bluetooth Direct. Untuk MP-80M gunakan RawBT.');
    }
  }
}

function setBTState(s){
  btState=s;
  const b=document.getElementById('btNavBtn'),t=document.getElementById('btNavText');
  if(!b||!t)return;
  b.classList.toggle('bt-connected',s==='connected');
  if(s==='pairing'){
    t.innerHTML='<span class="bt-spin">⟳</span> Pairing…';
    b.title='Sedang pairing. Klik lagi untuk memilih ulang printer Bluetooth';
  }else if(s==='connected'){
    t.textContent='Putuskan BT';
    b.title='Klik untuk memutuskan Bluetooth printer';
  }else{
    t.textContent='Connect BT';
    b.title='Bluetooth Direct (BLE/GATT). MP-80M SPP gunakan RawBT.';
  }
}

function generateOwnerDailyReportText(f,t,sh,sales){
  const totalItem=sales.reduce((sum,s)=>sum+(s.items||[]).reduce((a,x)=>a+Number(x.qty||0),0),0);
  const totalPenjualan=sales.reduce((sum,s)=>sum+Number(s.total||0),0);

  const payments={};
  sales.forEach(s=>{
    const method=(s.method||'Lainnya').trim()||'Lainnya';
    payments[method]=(payments[method]||0)+Number(s.total||0);
  });

  const shifts={};
  sales.forEach(s=>{
    const key=String(s.shift||'-');
    if(!shifts[key])shifts[key]={count:0,total:0};
    shifts[key].count++;
    shifts[key].total+=Number(s.total||0);
  });

  const dateLabel=f===t
    ? `${String(Number(f.slice(8,10)))} / ${String(Number(f.slice(5,7)))} / ${f.slice(0,4)}`
    : `${String(Number(f.slice(8,10)))} / ${String(Number(f.slice(5,7)))} / ${f.slice(0,4)} - ${String(Number(t.slice(8,10)))} / ${String(Number(t.slice(5,7)))} / ${t.slice(0,4)}`;

  const W=32;
  const line='-'.repeat(W);
  const padRow=(label,value)=>{
    label=String(label); value=String(value);
    const spaces=Math.max(1,W-label.length-value.length);
    return label+' '.repeat(spaces)+value+'\n';
  };
  const center=(text)=>{
    text=String(text);
    const left=Math.max(0,Math.floor((W-text.length)/2));
    return ' '.repeat(left)+text+'\n';
  };

  let text='';
  text+=center((db.settings.name||'WARKOP').toUpperCase());
  text+=center('LAPORAN PENJUALAN HARIAN');
  text+='\n';
  text+=`Tanggal : ${dateLabel}\n`;
  if(sh) text+=`Shift   : ${sh}\n`;
  text+=line+'\n';
  text+=padRow('Transaksi',sales.length);
  text+=padRow('Total Item',totalItem);
  text+=padRow('Penjualan',rupiah(totalPenjualan));
  text+=line+'\n';
  text+='PEMBAYARAN\n';

  const paymentKeys=Object.keys(payments);
  if(paymentKeys.length){
    paymentKeys.forEach(method=>{
      text+=padRow(method,rupiah(payments[method]));
    });
  }else{
    text+=padRow('-',rupiah(0));
  }

  text+=line+'\n';
  text+='REKAP PER SHIFT\n';

  const shiftOrder=['1','2','3'];
  const existing=Object.keys(shifts).filter(x=>!shiftOrder.includes(x));
  const shiftKeys=[...shiftOrder.filter(x=>shifts[x]),...existing];
  if(shiftKeys.length){
    shiftKeys.forEach(k=>{
      text+=padRow(`Shift ${k} (${shifts[k].count} trx)`,rupiah(shifts[k].total));
    });
  }else{
    text+=padRow('Shift - (0 trx)',rupiah(0));
  }

  text+=line+'\n';
  text+=padRow('TOTAL PENJUALAN',rupiah(totalPenjualan));
  text+='\n\n';
  return text;
}

async function printOwnerDailyReport(){
  const f = document.getElementById('rFrom')?.value || dateKey();
  const t = document.getElementById('rTo')?.value || f;
  const sh = document.getElementById('rShift')?.value || '';

  if(!f || !t) return toast('Tanggal laporan belum dipilih.');
  if(f > t) return toast('Tanggal mulai tidak boleh lebih besar dari tanggal akhir.');

  // Proses filter rentang tanggal akurat (Memotong jam & menit)
  const sales = db.sales.filter(s => {
    if (!s.businessDate) return false;
    const tglMurniData = String(s.businessDate).substring(0, 10);
    const matchDate = tglMurniData >= f && tglMurniData <= t;
    const matchShift = !sh || String(s.shift) === String(sh);
    const notVoided = !s.voided;
    return matchDate && matchShift && notVoided;
  });

  if (!sales || sales.length === 0) {
    return toast('Sistem mendeteksi 0 Transaksi untuk tanggal/shift ini.');
  }

  // Generate teks laporan
  let plainText = generateOwnerDailyReportText(f, t, sh, sales);
  
  // Bersihkan karakter asing agar driver printer 58mm tidak bingung
  plainText = String(plainText).replace(/[^\x20-\x7E\n]/g, ''); 

  // Mengirim data langsung ke mesin printer Smartcom RPP02N
  if(btState === 'connected' && printCharacteristic){
    try{
      toast('Sedang mencetak laporan ke printer RPP02N...');
      
      // Memanggil fungsi khusus report yang memiliki jeda napas data
      await writeBluetoothReportOnly(plainText);
      
      // Dorong kertas kosong ekstra manual di akhir agar teks keluar penuh dari gerigi sobekan
      await writeBluetoothReportOnly('\n\n\n\n');
      
      toast('Laporan Owner berhasil dicetak langsung via Bluetooth.');
      return;
    }catch(e){
      console.error('Direct Web Bluetooth laporan owner failed:', e);
      resetBTState();
      toast('Gagal mencetak fisik. Dialihkan ke preview layar.');
    }
  }

  // Jika koneksi putus baru lari ke preview layar
  openOwnerDailyReportPreview(f, t, sh, sales);
}

     return alert(`Laporan Excel Shift ${sh} belum bisa ditarik karena shift masih aktif. Lakukan Closing Shift terlebih dahulu.`);
   }
 }else{
   const activeSessions=(db.shiftSessions||[]).filter(s=>s.businessDate>=f&&s.businessDate<=t&&!s.closed);
   if(activeSessions.length){
     return alert('Laporan Excel belum bisa ditarik karena masih ada shift aktif pada rentang tanggal tersebut. Lakukan Closing Shift terlebih dahulu.');
   }
 }

 const allSales=db.sales.filter(s=>s.businessDate>=f&&s.businessDate<=t&&(!sh||s.shift===sh));
 const sales=allSales.filter(s=>!s.voided);
 const voids=db.voids.filter(v=>v.businessDate>=f&&v.businessDate<=t&&(!sh||v.shift===sh));

 const rekap=[['No Struk','Tanggal/Waktu','Kasir','Shift','Meja/Nama','Total Subtotal','Diskon Struk','PPN','Total Akhir','Metode']];
 sales.forEach(s=>{
   const sub=s.items.reduce((a,x)=>a+x.price*x.qty,0);

   const after=sub-disc;
   const ppn=s.tax?after*s.tax/100:0;
   rekap.push([s.id,new Date(s.date).toLocaleString('id-ID'),s.cashier,'Shift '+s.shift,s.customer,sub,disc,ppn,s.total,s.method]);
 });
 const totalAkhir=sales.reduce((a,s)=>a+s.total,0);
 rekap.push(['','','','','TOTAL PENJUALAN','','','',totalAkhir,'']);

 const detail=[['No Struk','Tanggal Transaksi','Nama Barang','Harga Satuan','Qty','Total Harga']];
 sales.forEach(s=>s.items.forEach(x=>detail.push([s.id,new Date(s.date).toLocaleDateString('id-ID'),x.name,x.price,x.qty,x.price*x.qty])));

 const audit=[['LAPORAN AUDIT TRANSAKSI VOID (BATAL)'],[new Date(f+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})+(f!==t?' - '+new Date(t+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}):'')],[db.settings.name||'WARKOP'],[],['Waktu / Tanggal','No Struk','Kasir / Shift','Detail Barang','Nominal Batal','Alasan Void']];
 voids.forEach(v=>{

 toast('Laporan Excel 3 sheet berhasil dibuat. Transaksi VOID tidak dimasukkan ke Rekap/Detail.');
}

function xmlEsc(v){
 return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
}
function colName(n){
 let s=''; n++;
 while(n){let r=(n-1)%26;s=String.fromCharCode(65+r)+s;n=Math.floor((n-1)/26)}
 return s;
}
function xlsxSheet(rows){
 let maxCols=Math.max(1,...rows.map(r=>r.length));
 let widths=[];
 for(let c=0;c<maxCols;c++) widths[c]=Math.min(45,Math.max(10,...rows.map(r=>String(r[c]??'').length+2)));
 let cols=widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('');
 let body=rows.map((row,ri)=>{
   const cells=row.map((v,ci)=>{
     if(v===null||v===undefined||v==='') return '';
     const ref=colName(ci)+(ri+1);
     if(typeof v==='number' && Number.isFinite(v)) return `<c r="${ref}"><v>${v}</v></c>`;
     return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
   }).join('');
   return `<row r="${ri+1}">${cells}</row>`;
 }).join('');
 return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"/></sheetViews><cols>${cols}</cols><sheetData>${body}</sheetData></worksheet>`;
}
function crc32(buf){
 let table=crc32.table;
 if(!table){table=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);table[n]=c>>>0}crc32.table=table}
 let c=0xFFFFFFFF;for(let i=0;i<buf.length;i++)c=table[(c^buf[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;
}
function u16(n){return new Uint8Array([n&255,(n>>>8)&255])}
function u32(n){return new Uint8Array([n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255])}
function concatBytes(parts){
 let len=parts.reduce((a,p)=>a+p.length,0),out=new Uint8Array(len),o=0;
 parts.forEach(p=>{out.set(p,o);o+=p.length});return out;
}
function zipStore(files){
 const enc=new TextEncoder(), locals=[], centrals=[];let offset=0;
 files.forEach(file=>{
   const name=enc.encode(file.name),data=enc.encode(file.data),crc=crc32(data);
   const lh=concatBytes([new Uint8Array([80,75,3,4]),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),name,data]);
   locals.push(lh);
   const ch=concatBytes([new Uint8Array([80,75,1,2]),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset),name]);
   centrals.push(ch);offset+=lh.length;
 });
 const central=concatBytes(centrals),local=concatBytes(locals);
 const end=concatBytes([new Uint8Array([80,75,5,6]),u16(0),u16(0),u16(files.length),u16(files.length),u32(central.length),u32(local.length),u16(0)]);
 return new Blob([local,central,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function xlsxBlob(sheets){
 const enc=new TextEncoder();
 const workbook=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s,i)=>`<sheet name="${xmlEsc(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`;
 const rels=sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('');
 const content=[
   `<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>`,
   ...sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`)
 ].join('');
 const files=[
  {name:'[Content_Types].xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`},
  {name:'_rels/.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
  {name:'xl/workbook.xml',data:workbook},
  {name:'xl/_rels/workbook.xml.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${rels}</Relationships>`},
  ...sheets.map((s,i)=>({name:`xl/worksheets/sheet${i+1}.xml`,data:xlsxSheet(s.rows)}))
 ];
 return zipStore(files);
}
function sheet(title,rows){return `<h2>${title}</h2><table border="1">${rows.map((r,i)=>`<tr>${r.map(c=>`<${i?'td':'th'}>${esc(c)}</${i?'td':'th'}>`).join('')}</tr>`).join('')}</table>`}
